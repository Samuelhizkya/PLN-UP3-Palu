<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoring Kinerja PLN UP3 Palu</title>

    <!-- Google Fonts: Poppins + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* --- Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0b2a4a 0%, #125D72 50%, #0a3d4b 100%);
            position: relative;
            padding: 20px;
        }

        /* --- Background Gambar --- */
        .login-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .login-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .login-background .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                rgba(11, 42, 74, 0.70) 0%,
                rgba(18, 93, 114, 0.50) 50%,
                rgba(10, 61, 75, 0.65) 100%);
            z-index: 1;
        }

        /* --- Header (Logo & Home) di luar kartu --- */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 20px 40px 16px 40px;
            background: transparent;
            pointer-events: none;
        }

        .page-header .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            padding-bottom: 14px;
        }

        .page-header .header-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
                rgba(255, 255, 255, 0.05) 0%,
                rgba(255, 255, 255, 0.35) 20%,
                rgba(255, 255, 255, 0.50) 50%,
                rgba(255, 255, 255, 0.35) 80%,
                rgba(255, 255, 255, 0.05) 100%);
            margin-top: 0;
            position: relative;
        }

        .page-header .header-line::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -10%;
            width: 20%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -20%; }
            100% { left: 110%; }
        }

        .page-header .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            pointer-events: auto;
        }

        .page-header .logo-wrapper .logo-box {
            background: white;
            border-radius: 10px;
            padding: 6px 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
        }

        .page-header .logo-wrapper .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .page-header .logo-wrapper .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            color: white;
        }

        .page-header .logo-wrapper .brand-text .title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: white;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .page-header .logo-wrapper .brand-text .sub {
            font-weight: 400;
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            letter-spacing: 0.3px;
        }

        .page-header .nav-home {
            pointer-events: auto;
        }

        .page-header .nav-home a {
            font-size: 15px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 6px 16px;
            border-radius: 8px;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .page-header .nav-home a:hover {
            background: rgba(255,255,255,0.20);
        }

        /* --- KONTEN UTAMA --- */
        .main-content {
            position: relative;
            z-index: 5;
            max-width: 640px;
            width: 100%;
            text-align: center;
            margin-top: 100px;
            padding: 20px;
        }

        .main-content h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 38px;
            letter-spacing: -0.5px;
            line-height: 1.2;
            color: #EFE62F;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4), 0 0 40px rgba(239, 230, 47, 0.15);
        }

        .main-content h1 .highlight {
            color: #EFE62F;
            background: none;
            padding: 0;
        }

        .main-content .sub-pln {
            font-size: 15px;
            color: rgba(255,255,255,0.85);
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 4px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.2);
        }

        .main-content .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.80);
            margin-top: 14px;
            line-height: 1.7;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            text-shadow: 0 1px 8px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease, max-height 0.3s ease;
        }

        .main-content .subtitle strong {
            color: white;
            font-weight: 600;
        }

        .main-content .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 28px;
            padding: 16px 48px;
            background: linear-gradient(135deg, #0b2a4a 0%, #125D72 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(11, 42, 74, 0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .main-content .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(11, 42, 74, 0.5);
        }

        .main-content .btn-login:active {
            transform: translateY(0);
        }

        .main-content.hide-description .subtitle,
        .main-content.hide-description .btn-login {
            display: none;
        }

        /* ============================================================
           FORM LOGIN - DENGAN EFEK GRADASI
           ============================================================ */
        .login-form-container {
            display: none;
            margin-top: 24px;
            padding: 32px 36px 28px;
            border-radius: 20px;
            animation: fadeIn 0.4s ease;
            text-align: left;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;

            /* 🔥 GRADASI BACKGROUND */
            background: linear-gradient(145deg,
                rgba(255, 255, 255, 0.92) 0%,
                rgba(230, 245, 255, 0.85) 50%,
                rgba(200, 235, 250, 0.80) 100%);

            /* 🔥 BORDER GRADASI */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-image: linear-gradient(135deg, #14A2BA, #125D72, #0b2a4a) 1;

            /* 🔥 SHADOW GRADASI */
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);

            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        /* 🔥 EFEK GRADASI BERGERAK (OPSIONAL) */
        .login-form-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(20, 162, 186, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(18, 93, 114, 0.06) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
            animation: gradientMove 8s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(5%, 5%) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .login-form-container.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-form-container .form-group {
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .login-form-container .form-group label {
            font-weight: 500;
            font-size: 14px;
            color: #0b2a4a;
            display: block;
            margin-bottom: 4px;
        }

        .login-form-container .form-group label i {
            margin-right: 8px;
            color: #125D72;
        }

        .login-form-container .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid rgba(13, 52, 78, 0.15);
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
        }

        .login-form-container .form-group input:focus {
            border-color: #14A2BA;
            outline: none;
            box-shadow: 0 0 0 4px rgba(20, 162, 186, 0.15), 0 0 20px rgba(20, 162, 186, 0.05);
            background: rgba(255, 255, 255, 0.9);
        }

        .login-form-container .form-group input::placeholder {
            color: #8aa3c0;
        }

        /* 🔥 TOMBOL LOGIN DENGAN GRADASI */
        .login-form-container .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0b2a4a 0%, #125D72 50%, #14A2BA 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 16px rgba(18, 93, 114, 0.3);
        }

        .login-form-container .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(18, 93, 114, 0.4);
        }

        .login-form-container .btn-close-form {
            background: transparent;
            border: none;
            color: #6c757d;
            cursor: pointer;
            font-size: 14px;
            padding: 0 0 12px 0;
            display: block;
            margin: 0 auto 4px auto;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
            position: relative;
            z-index: 1;
        }

        .login-form-container .btn-close-form:hover {
            color: #b33a3a;
        }

        .login-form-container .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .login-form-container .form-options .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-form-container .form-options .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #125D72;
            cursor: pointer;
        }

        .login-form-container .form-options .checkbox-group label {
            font-size: 13px;
            color: #2a4a6a;
            cursor: pointer;
        }

        .login-form-container .form-options .forgot-link {
            font-size: 13px;
            color: #14A2BA;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .login-form-container .form-options .forgot-link:hover {
            color: #0b2a4a;
            text-decoration: underline;
        }

        /* --- Footer --- */
        .main-content .login-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.15);
        }

        .main-content .login-footer .copyright {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .main-content .login-footer .copyright strong {
            color: rgba(255,255,255,0.8);
        }

        /* --- Responsive --- */
        @media (max-width: 600px) {
            .page-header {
                padding: 16px 20px 12px 20px;
            }

            .page-header .logo-wrapper .logo-box {
                width: 40px;
                height: 40px;
                padding: 4px 6px;
            }

            .page-header .logo-wrapper .brand-text .title {
                font-size: 13px;
            }

            .page-header .nav-home {
                align-self: flex-end;
                margin-top: -36px;
            }

            .main-content {
                margin-top: 100px;
                padding: 16px;
            }

            .main-content h1 {
                font-size: 26px;
            }

            .main-content .subtitle {
                font-size: 14px;
            }

            .main-content .btn-login {
                padding: 14px 32px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }

            .login-form-container {
                padding: 24px 20px 20px;
            }
        }

        @media (max-width: 400px) {
            .page-header {
                padding: 12px 16px 10px 16px;
            }

            .page-header .logo-wrapper .logo-box {
                width: 34px;
                height: 34px;
                padding: 3px 4px;
            }

            .page-header .logo-wrapper .brand-text .title {
                font-size: 11px;
            }

            .page-header .logo-wrapper .brand-text .sub {
                font-size: 9px;
            }

            .main-content {
                margin-top: 90px;
                padding: 12px;
            }

            .main-content h1 {
                font-size: 20px;
            }

            .main-content .subtitle {
                font-size: 13px;
            }

            .main-content .btn-login {
                font-size: 13px;
                padding: 12px 24px;
            }

            .login-form-container {
                padding: 18px 16px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    BACKGROUND: GAMBAR BANGUNAN PLN
    ============================================================ -->
    <div class="login-background">
        <img src="https://assets.faktasulteng.id/assets/archive-photos/2026/02/26/origin/pln-up3-palu-menjalankan-berba-1772098658.webp"
             alt="Gedung PLN UP3 Palu"
             loading="lazy"
             onerror="this.style.display='none'">
        <div class="overlay"></div>
    </div>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header class="page-header">
        <div class="header-content">
            <a href="#" class="logo-wrapper">
                <div class="logo-box">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Logo_PLN.png/960px-Logo_PLN.png"
                         alt="Logo PLN"
                         loading="lazy"
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22 rx=%2212%22/%3E%3Cpath d=%22M55 20L38 52H50L45 80L62 48H50L55 20Z%22 fill=%22%23EFE62F%22 stroke=%22%23125D72%22 stroke-width=%223%22/%3E%3C/svg%3E'">
                </div>
                <div class="brand-text">
                    <span class="title">PT PLN (PERSERO)</span>
                    <span class="sub">UP3 PALU</span>
                </div>
            </a>

            <div class="nav-home">
                <a href="#">Home</a>
            </div>
        </div>

        <div class="header-line"></div>
    </header>

    <!-- ============================================================
    KONTEN UTAMA
    ============================================================ -->
    <main class="main-content" id="mainContent">

        <h1>
            MONITORING <span class="highlight">KINERJA</span>
        </h1>
        <p class="sub-pln">PT PLN (PERSERO) UP3 PALU</p>

        <p class="subtitle" id="descriptionText">
            Sistem Informasi Monitoring Kinerja Terpadu untuk
            <strong>memantau, mengelola, dan mengevaluasi</strong> kinerja
            unit kerja di lingkungan <strong>PLN UP3 Palu</strong>.
        </p>

        <button class="btn-login" id="btnShowForm" onclick="toggleForm()">
            <i class="fas fa-sign-in-alt"></i> LOGIN UNTUK MENGAKSES SISTEM
        </button>

        <!-- ============================================================
        FORM LOGIN - DENGAN EFEK GRADASI
        ============================================================ -->
        <div class="login-form-container" id="loginForm">
            <button class="btn-close-form" onclick="toggleForm()">
                <i class="fas fa-times"></i> Tutup
            </button>

            <form action="dashboard_pimpinan.html" method="POST">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Masukkan username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Masukkan password" required>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Ingat saya</label>
                    </div>
                    <a href="#" class="forgot-link">Lupa Password?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
        </div>

        <!-- FOOTER -->
        <div class="login-footer">
            <div class="copyright">
                &copy; 2026 <strong>PLN UP3 Palu</strong> — Integrated Performance Monitoring System
            </div>
        </div>

    </main>

    <script>
        function toggleForm() {
            const form = document.getElementById('loginForm');
            const mainContent = document.getElementById('mainContent');
            const descText = document.getElementById('descriptionText');
            const btnShow = document.getElementById('btnShowForm');

            form.classList.toggle('show');

            if (form.classList.contains('show')) {
                descText.style.display = 'none';
                btnShow.style.display = 'none';
                setTimeout(() => {
                    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            } else {
                descText.style.display = 'block';
                btnShow.style.display = 'inline-flex';
            }
        }
    </script>

</body>
</html>
